<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fenix v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --bg-card: #141414;
  --bg-card-hover: #181818;
  --bg-modal: #0e0e0e;
  --fg: #f0e6d3;
  --fg-secondary: #c8bba8;
  --fg-muted: #5a5347;
  --accent: #7B9ACC;
  --accent-glow: rgba(123, 154, 204, 0.15);
  --accent-border: rgba(123, 154, 204, 0.3);
  --accent-soft: rgba(123, 154, 204, 0.08);
  --border: #222;
  --border-light: #2a2a2a;
  --shadow: rgba(0, 0, 0, 0.5);
  --visited-opacity: 0.5;
  color-scheme: dark;
}

[data-theme="light"] {
  --bg: #f5f3f0;
  --bg-card: #ffffff;
  --bg-card-hover: #f0ede8;
  --bg-modal: #f5f3f0;
  --fg: #3a3632;
  --fg-secondary: #6b6560;
  --fg-muted: #9a948e;
  --accent: #5a7ba8;
  --accent-glow: rgba(90, 123, 168, 0.12);
  --accent-border: rgba(90, 123, 168, 0.3);
  --accent-soft: rgba(90, 123, 168, 0.06);
  --border: #c5c0b8;
  --border-light: #d5d0c9;
  --shadow: rgba(0, 0, 0, 0.08);
  --visited-opacity: 0.45;
  color-scheme: light;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--fg);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

/* ── Main column ── */
.fenix-home {
  max-width: 540px;
  width: 100%;
  margin: 0 auto;
  padding: 56px 16px 100px;
}

/* ── Theme toggle ── */
.theme-btn {
  position: fixed; top: 20px; right: 20px;
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--fg); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  z-index: 100; transition: opacity 0.2s;
}
.theme-btn:hover { opacity: 0.8; }
.theme-btn svg { width: 16px; height: 16px; fill: none; stroke: var(--bg); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.theme-btn .icon-sun { display: none; }
[data-theme="light"] .theme-btn .icon-moon { display: none; }
[data-theme="light"] .theme-btn .icon-sun { display: block; }

/* ── Persona chips ── */
.persona-bar {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-bottom: 40px;
}
.persona-chip {
  padding: 5px 10px;
  border-radius: 3px;
  font-size: 11px; font-weight: 500;
  letter-spacing: 0.02em;
  border: 1px solid var(--border);
  background: transparent; color: var(--fg-muted);
  cursor: pointer; font-family: inherit;
  transition: all 0.15s ease;
}
.persona-chip:hover { color: var(--fg-secondary); border-color: var(--border-light); }
.persona-chip.active {
  border-color: var(--accent); color: var(--accent);
  background: var(--accent-soft);
}
.persona-chip.planned { opacity: 0.3; cursor: default; }

/* ── Fenix identity ── */
.fenix-id {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px;
}
.fenix-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  border: 1.5px solid var(--accent-border);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
  box-shadow: 0 0 12px var(--accent-glow);
}
.fenix-name {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 15px; font-weight: 500; color: var(--fg);
  letter-spacing: 0.02em;
}
.fenix-dot {
  display: inline-block; width: 6px; height: 6px;
  border-radius: 50%; background: rgba(74, 190, 120, 0.85);
  margin-left: 5px; vertical-align: middle;
}

/* ── Opening ── */
.fenix-opening {
  font-size: 14px; line-height: 1.65; color: var(--fg-secondary);
  margin-bottom: 32px;
  padding-left: 46px;
}
.fenix-opening p + p { margin-top: 10px; }

/* ── Section label ── */
.section-label {
  font-family: 'Space Mono', monospace;
  font-size: 10px; font-weight: 400;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--fg-muted); margin-bottom: 10px;
  padding-left: 2px;
}

/* ── Card list ── */
.card-list { display: flex; flex-direction: column; gap: 1px; }

/* ── Individual card ── */
.card {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 14px 16px;
  background: transparent;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.15s ease, opacity 0.3s ease;
  position: relative;
}
.card:first-child { border-top: 1px solid var(--border); }
.card:hover { background: var(--bg-card); }
.card:active { background: var(--bg-card-hover); }
.card.visited { opacity: var(--visited-opacity); }
.card.visited:hover { opacity: 0.75; }
.card.locked { cursor: default; }
.card.locked:hover { background: transparent; }

/* Card icon */
.card-icon {
  width: 18px; height: 18px; flex-shrink: 0;
  color: var(--fg-muted); margin-top: 2px;
  transition: color 0.15s;
}
.card:hover .card-icon { color: var(--accent); }
.card-icon svg { width: 100%; height: 100%; }

/* Card content */
.card-body { flex: 1; min-width: 0; }
.card-title-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.card-title {
  font-size: 14px; font-weight: 600; color: var(--fg);
  line-height: 1.3; letter-spacing: -0.01em;
}
.card-tag {
  font-family: 'Space Mono', monospace;
  font-size: 9px; letter-spacing: 0.04em;
  text-transform: uppercase; line-height: 1;
  padding: 2px 6px;
  border-radius: 2px;
  white-space: nowrap;
}
.card-tag--tool {
  color: var(--accent);
  background: var(--accent-soft);
}
.card-tag--fun {
  color: #c89a3a;
  background: rgba(200, 154, 58, 0.08);
}
[data-theme="light"] .card-tag--fun {
  color: #8a6a28;
  background: rgba(138, 106, 40, 0.08);
}
.card-tag--gated {
  color: var(--fg-muted);
  background: rgba(255, 255, 255, 0.03);
}
[data-theme="light"] .card-tag--gated {
  background: rgba(0, 0, 0, 0.03);
}
.card-tag--framework {
  color: #4daf8b;
  background: rgba(77, 175, 139, 0.08);
}
[data-theme="light"] .card-tag--framework {
  color: #3a8a6a;
  background: rgba(58, 138, 106, 0.08);
}
.card-hook {
  font-size: 13px; line-height: 1.5; color: var(--fg-muted);
  margin-top: 4px;
}
.card-cta {
  font-size: 12px; font-weight: 500; color: var(--accent);
  margin-top: 6px; letter-spacing: -0.01em;
}
.card-lock {
  font-size: 12px; color: var(--fg-muted); margin-top: 6px;
  font-style: italic;
}
.card-visited-mark {
  position: absolute; top: 14px; right: 14px;
  font-size: 10px; color: var(--fg-muted);
  font-family: 'Space Mono', monospace; letter-spacing: 0.02em;
}

/* ── Bottom bar ── */
.bottom-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  padding: 10px 16px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  background: var(--bg); border-top: 1px solid var(--border);
  display: flex; justify-content: center; z-index: 50;
}
.bottom-inner { max-width: 540px; width: 100%; display: flex; gap: 8px; }
.bottom-input {
  flex: 1; padding: 10px 14px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 3px; color: var(--fg);
  font-family: inherit; font-size: 13px; outline: none;
}
.bottom-input:focus { border-color: var(--accent-border); }
.bottom-input::placeholder { color: var(--fg-muted); }
.bottom-send {
  width: 38px; height: 38px;
  background: var(--fg); border: none; border-radius: 3px;
  color: var(--bg); cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: opacity 0.15s;
}
.bottom-send:hover { opacity: 0.8; }
.bottom-send svg { width: 16px; height: 16px; }

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0, 0, 0, 0.7);
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease;
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }

.modal-sheet {
  width: 100%; max-width: 560px;
  max-height: 85vh; min-height: 280px;
  background: var(--bg);
  border: 1px solid var(--border); border-bottom: none;
  border-radius: 0;
  display: flex; flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.modal-overlay.open .modal-sheet { transform: translateY(0); }

.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px 14px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.modal-title-wrap { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.modal-kicker {
  font-family: 'Space Mono', monospace;
  font-size: 9px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--accent);
}
.modal-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 15px; font-weight: 600; color: var(--fg);
  letter-spacing: -0.01em;
}
.modal-close {
  width: 28px; height: 28px;
  background: transparent; border: 1px solid var(--border);
  color: var(--fg-muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; font-size: 16px; font-family: inherit;
  transition: border-color 0.15s, color 0.15s;
  border-radius: 0;
}
.modal-close:hover { border-color: var(--fg-muted); color: var(--fg); }

/* Modal body */
.modal-body {
  flex: 1; overflow-y: auto; padding: 20px;
  display: flex; flex-direction: column; gap: 14px;
}

.modal-fenix {
  display: flex; align-items: center; gap: 8px;
}
.modal-fenix-av {
  width: 24px; height: 24px; border-radius: 50%;
  border: 1px solid var(--accent-border);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; flex-shrink: 0;
}
.modal-fenix-nm {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 12px; font-weight: 500; color: var(--fg-secondary);
}

.modal-question {
  padding: 14px 16px;
  border-left: 2px solid var(--accent-border);
  font-size: 13px; line-height: 1.65; color: var(--fg-secondary);
  background: transparent;
}

/* Input inside modal */
.modal-input-row { display: flex; gap: 8px; }
.modal-input {
  flex: 1; padding: 10px 12px;
  background: transparent; border: 1px solid var(--border);
  border-radius: 0; color: var(--fg);
  font-family: inherit; font-size: 13px; outline: none;
}
.modal-input:focus { border-color: var(--accent-border); }
.modal-input::placeholder { color: var(--fg-muted); }
.modal-submit {
  padding: 10px 16px;
  background: var(--fg); color: var(--bg); border: none;
  border-radius: 0;
  font-family: inherit; font-size: 13px; font-weight: 600;
  cursor: pointer; flex-shrink: 0;
  letter-spacing: 0.01em;
  transition: opacity 0.15s;
}
.modal-submit:hover { opacity: 0.85; }

/* Thinking */
.modal-thinking {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px;
  border-left: 2px solid var(--border);
}
.modal-thinking-dots { display: flex; gap: 4px; }
.modal-thinking-dots span {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--fg-muted); animation: blink 1.2s ease infinite;
}
.modal-thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
.modal-thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
.modal-thinking-label {
  font-family: 'Space Mono', monospace;
  font-size: 11px; color: var(--fg-muted);
}

/* Output */
.modal-output {
  padding: 16px;
  border-left: 2px solid var(--accent);
  font-size: 13px; line-height: 1.65;
}
.modal-output h4 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px; font-weight: 600; color: var(--fg);
  margin: 0 0 6px; letter-spacing: -0.01em;
}
.modal-output p {
  font-size: 13px; line-height: 1.65; color: var(--fg-secondary);
  margin: 0 0 10px;
}
.modal-output p:last-child { margin-bottom: 0; }
.modal-output strong { color: var(--fg); font-weight: 600; }
.modal-output .output-section { margin-bottom: 14px; }
.modal-output .output-section:last-child { margin-bottom: 0; }
.modal-output .output-label {
  font-family: 'Space Mono', monospace;
  font-size: 9px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--accent);
  margin-bottom: 4px;
}

/* Choice buttons */
.modal-choices { display: flex; flex-wrap: wrap; gap: 6px; }
.modal-choice {
  padding: 7px 12px;
  background: transparent; border: 1px solid var(--border);
  border-radius: 0;
  font-size: 12px; font-weight: 500; color: var(--fg-secondary);
  cursor: pointer; font-family: inherit;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.modal-choice:hover {
  background: var(--bg-card); border-color: var(--accent-border); color: var(--fg);
}

/* Follow-up actions */
.modal-actions { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 4px; }
.modal-action {
  padding: 7px 12px;
  background: transparent; border: 1px solid var(--border);
  border-radius: 0; font-size: 12px; color: var(--fg-secondary);
  cursor: pointer; font-family: inherit;
  transition: background 0.15s, border-color 0.15s;
}
.modal-action:hover { background: var(--bg-card); border-color: var(--accent-border); color: var(--fg); }

/* Visitor echo */
.modal-visitor-echo { display: flex; justify-content: flex-end; }
.modal-visitor-bubble {
  padding: 8px 14px;
  background: var(--fg); color: var(--bg);
  font-size: 13px; font-weight: 500;
  max-width: 80%; border-radius: 0;
}

/* Animations */
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
@keyframes blink { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
.fade-in { animation: fadeIn 0.25s ease forwards; }

[hidden] { display: none !important; }
</style>
</head>
<body>

<button class="theme-btn" id="theme-toggle" title="Toggle theme">
  <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
  <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
</button>

<div class="fenix-home">

  <div class="persona-bar">
    <button class="persona-chip active" data-persona="evaluator">Evaluator</button>
    <button class="persona-chip" data-persona="practitioner">Practitioner</button>
    <button class="persona-chip" data-persona="technologist">Technologist</button>
    <button class="persona-chip" data-persona="learner">Learner</button>
    <button class="persona-chip planned" data-persona="seeker">Seeker</button>
    <button class="persona-chip planned" data-persona="innercircle">Inner Circle</button>
  </div>

  <div class="fenix-id">
    <div class="fenix-avatar">🔥</div>
    <div class="fenix-name">Fenix <span class="fenix-dot"></span></div>
  </div>

  <div id="greeting" class="fenix-opening"></div>

  <div class="section-label" id="section-label"></div>
  <div class="card-list" id="card-list"></div>

</div>

<div class="bottom-bar">
  <div class="bottom-inner">
    <input class="bottom-input" placeholder="Ask Fenix anything..." aria-label="Ask Fenix anything">
    <button class="bottom-send" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 14-7-4 18-5-6Z"/><path d="m5 12 5 5"/></svg>
    </button>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-sheet">
    <div class="modal-header">
      <div class="modal-title-wrap">
        <div class="modal-kicker" id="modal-kicker"></div>
        <div class="modal-title" id="modal-title"></div>
      </div>
      <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>

  var toggle = document.getElementById('theme-toggle');

  var ICONS = {

    chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 14 3-4 4 3 5-7"/></svg>',
    sparkle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .962 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.962 0Z"/></svg>',
    trade: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>',
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/></svg>',

  var visited = {};
  var currentPersona = 'evaluator';

  function setAccent(hex) {
    var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    document.documentElement.style.setProperty('--accent', hex);
    document.documentElement.style.setProperty('--accent-glow', 'rgba('+r+','+g+','+b+',0.15)');
    document.documentElement.style.setProperty('--accent-border', 'rgba('+r+','+g+','+b+',0.3)');
    document.documentElement.style.setProperty('--accent-soft', 'rgba('+r+','+g+','+b+',0.08)');
  }

  function renderPersona(key) {
    var p = PERSONAS[key];
    if (!p) return;
    currentPersona = key;
    setAccent(p.accent);

    document.querySelectorAll('.persona-chip').forEach(function(c) {
      c.classList.toggle('active', c.dataset.persona === key);
    });

    document.getElementById('greeting').innerHTML = p.opening;
    document.getElementById('section-label').textContent = p.label;

    var list = document.getElementById('card-list');
    list.innerHTML = '';

    p.cards.forEach(function(card) {
      var el = document.createElement('div');
      el.className = 'card';
      if (visited[key + ':' + card.id]) el.classList.add('visited');
      if (card.locked) el.classList.add('locked');
      el.setAttribute('tabindex', '0');
      el.setAttribute('role', 'button');

      var iconSvg = ICONS[card.icon] || ICONS.target;
      var isVisited = visited[key + ':' + card.id];

      el.innerHTML =
        (isVisited ? '<div class="card-visited-mark">✓</div>' : '') +
        '<div class="card-icon">' + iconSvg + '</div>' +
        '<div class="card-body">' +
          '<div class="card-title-row">' +
            '<span class="card-title">' + card.title + '</span>' +
            '<span class="card-tag card-tag--' + (card.tagType || 'tool') + '">' + card.tag + '</span>' +
          '</div>' +
          '<div class="card-hook">' + card.hook + '</div>' +
          (card.locked
            ? '<div class="card-lock">🔒 Connect to unlock.</div>'
            : '<div class="card-cta">' + card.cta + '</div>') +
        '</div>';

      el.addEventListener('click', function() {
        if (card.locked) return;
        openModal(card);
      });
      el.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (!card.locked) openModal(card); }
      });

      list.appendChild(el);
    });
  }

  // ── Modal ──
  var modal = document.getElementById('modal');
  var modalBody = document.getElementById('modal-body');

  function openModal(card) {
    var m = card.modal;
    document.getElementById('modal-kicker').textContent = m.kicker;
    document.getElementById('modal-title').textContent = m.title;
    modalBody.innerHTML = '';

    var bar = document.createElement('div');
    bar.className = 'modal-fenix';
    bar.innerHTML = '<div class="modal-fenix-av">🔥</div><div class="modal-fenix-nm">Fenix</div>';
    modalBody.appendChild(bar);

    var q = document.createElement('div');
    q.className = 'modal-question fade-in';
    q.textContent = m.question;
    modalBody.appendChild(q);

    if (m.type === 'static') {
      showStaticOutput(m.output);
    } else if (m.type === 'choice') {
      showChoices(m.choices, m.output, card);
    } else if (m.type === 'input') {
      showInput(m.placeholder, m.thinkingLabel, m.output, card);
    }

    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
    visited[currentPersona + ':' + card.id] = true;
  }

  function closeModal() {
    modal.classList.remove('open');
    document.body.style.overflow = '';
    renderPersona(currentPersona);
  }

  function showStaticOutput(html) {
    var out = document.createElement('div');
    out.className = 'modal-output fade-in';
    out.innerHTML = html;
    modalBody.appendChild(out);
    addFollowUp();
  }

  function showChoices(choices, outputData, card) {
    var wrap = document.createElement('div');
    wrap.className = 'modal-choices fade-in';
    choices.forEach(function(choice) {
      var btn = document.createElement('button');
      btn.className = 'modal-choice';
      btn.textContent = choice;
      btn.addEventListener('click', function() {
        var echo = document.createElement('div');
        echo.className = 'modal-visitor-echo fade-in';
        echo.innerHTML = '<div class="modal-visitor-bubble">' + choice + '</div>';
        wrap.replaceWith(echo);
        showThinking('Working on it…', function() {
          var out = document.createElement('div');
          out.className = 'modal-output fade-in';
          out.innerHTML = typeof outputData === 'object' ? outputData.content : outputData;
          modalBody.appendChild(out);
          addFollowUp();
        });
      });
      wrap.appendChild(btn);
    });
    modalBody.appendChild(wrap);
  }

  function showInput(placeholder, thinkingLabel, outputHtml, card) {
    var row = document.createElement('div');
    row.className = 'modal-input-row fade-in';
    var input = document.createElement('input');
    input.className = 'modal-input';
    input.placeholder = placeholder;
    var btn = document.createElement('button');
    btn.className = 'modal-submit';
    btn.textContent = 'Go';
    row.appendChild(input);
    row.appendChild(btn);
    modalBody.appendChild(row);
    setTimeout(function() { input.focus(); }, 350);

    function submit() {
      var val = input.value.trim();
      if (!val) return;
      var echo = document.createElement('div');
      echo.className = 'modal-visitor-echo fade-in';
      echo.innerHTML = '<div class="modal-visitor-bubble">' + val + '</div>';
      row.replaceWith(echo);
      showThinking(thinkingLabel || 'Working on it…', function() {
        var out = document.createElement('div');
        out.className = 'modal-output fade-in';
        out.innerHTML = outputHtml;
        modalBody.appendChild(out);
        addFollowUp();
      });
    }
    btn.addEventListener('click', submit);
    input.addEventListener('keydown', function(e) { if (e.key === 'Enter') submit(); });
  }

  function showThinking(label, cb) {
    var think = document.createElement('div');
    think.className = 'modal-thinking fade-in';
    think.innerHTML = '<div class="modal-thinking-dots"><span></span><span></span><span></span></div><div class="modal-thinking-label">' + label + '</div>';
    modalBody.appendChild(think);
    modalBody.scrollTop = modalBody.scrollHeight;
    setTimeout(function() {
      think.remove();
      cb();
      modalBody.scrollTop = modalBody.scrollHeight;
    }, 1400);
  }

  function addFollowUp() {
    var wrap = document.createElement('div');
    wrap.className = 'modal-actions fade-in';
    wrap.innerHTML = '<button class="modal-action">Ask a follow-up</button><button class="modal-action" id="action-done">Done — back to cards</button>';
    modalBody.appendChild(wrap);
    modalBody.scrollTop = modalBody.scrollHeight;
    document.getElementById('action-done').addEventListener('click', closeModal);
  }

  document.getElementById('modal-close').addEventListener('click', closeModal);
  modal.addEventListener('click', function(e) { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape' && modal.classList.contains('open')) closeModal(); });

  document.querySelectorAll('.persona-chip:not(.planned)').forEach(function(chip) {
    chip.addEventListener('click', function() {
      var key = chip.dataset.persona;
      if (PERSONAS[key]) renderPersona(key);
    });
  });

  renderPersona('evaluator');
})();
</script>
</body>
</html>

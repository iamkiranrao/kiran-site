/* Layout: single-column cards + slide-up modal for each tool */
:root {
  --bg: #0a0a0a;
  --bg-card: #141414;
  --bg-card-hover: #1a1a1a;
  --bg-modal: #111;
  --fg: #f0e6d3;
  --fg-secondary: #c8bba8;
  --fg-muted: #5a5347;
  --accent: #7B9ACC;
  --accent-glow: rgba(123, 154, 204, 0.12);
  --accent-border: rgba(123, 154, 204, 0.25);
  --accent-soft: rgba(123, 154, 204, 0.08);
  --border: #222;
  --border-light: #2a2a2a;
  --radius: 12px;
  --radius-sm: 8px;
  --visited-opacity: 0.55;
  color-scheme: dark;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #faf8f5;
    --bg-card: #fff;
    --bg-card-hover: #f5f2ee;
    --bg-modal: #faf8f5;
    --fg: #1a1714;
    --fg-secondary: #4a4540;
    --fg-muted: #8a8580;
    --accent: #5a7ab8;
    --accent-glow: rgba(90, 122, 184, 0.08);
    --accent-border: rgba(90, 122, 184, 0.2);
    --accent-soft: rgba(90, 122, 184, 0.05);
    --border: #e5e0da;
    --border-light: #ede8e2;
    --visited-opacity: 0.5;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #faf8f5;
  --bg-card: #fff;
  --bg-card-hover: #f5f2ee;
  --bg-modal: #faf8f5;
  --fg: #1a1714;
  --fg-secondary: #4a4540;
  --fg-muted: #8a8580;
  --accent: #5a7ab8;
  --accent-glow: rgba(90, 122, 184, 0.08);
  --accent-border: rgba(90, 122, 184, 0.2);
  --accent-soft: rgba(90, 122, 184, 0.05);
  --border: #e5e0da;
  --border-light: #ede8e2;
  --visited-opacity: 0.5;
  color-scheme: light;
}

@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600&family=DM+Mono:wght@400&display=swap');

body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
  padding-inline: 16px;
  padding-block: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
}

/* ── Main column ── */
.fenix-home {
  max-width: 560px;
  width: 100%;
  padding-block: 48px 40px;
}

/* ── Persona chips ── */
.persona-bar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 32px;
}

.persona-chip {
  padding: 6px 12px;
  border-radius: 16px;
  font-size: 12px;
  font-weight: 500;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--fg-muted);
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
}
.persona-chip:hover { color: var(--fg-secondary); border-color: var(--border-light); }
.persona-chip.active { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
.persona-chip.planned { opacity: 0.35; cursor: default; }

/* ── Fenix header ── */
.fenix-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}
.fenix-avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--accent-glow);
  border: 1.5px solid var(--accent-border);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
}
.fenix-name { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.fenix-dot {
  display: inline-block; width: 7px; height: 7px;
  border-radius: 50%; background: #4daf8b; margin-left: 6px; vertical-align: middle;
}

/* ── Opening message ── */
.fenix-greeting {
  padding: 16px 20px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 15px; line-height: 1.6; color: var(--fg-secondary);
  margin-bottom: 28px;
}
.fenix-greeting p { margin: 0; }
.fenix-greeting p + p { margin-top: 10px; }

/* ── Cards section ── */
.cards-label {
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 12px;
}

.unlock-cards { display: flex; flex-direction: column; gap: 8px; }

.unlock-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, transform 0.15s, opacity 0.3s;
  position: relative;
}
.unlock-card:hover { background: var(--bg-card-hover); border-color: var(--accent-border); transform: translateY(-1px); }
.unlock-card:active { transform: scale(0.99); }
.unlock-card.visited { opacity: var(--visited-opacity); }
.unlock-card.visited:hover { opacity: 0.8; }

.card-top { display: flex; align-items: flex-start; gap: 12px; }
.card-icon {
  width: 20px; height: 20px; flex-shrink: 0;
  color: var(--accent); margin-top: 1px;
}
.card-icon svg { width: 100%; height: 100%; }
.card-meta { flex: 1; min-width: 0; }
.card-title { font-size: 15px; font-weight: 600; color: var(--fg); line-height: 1.3; }
.card-tag {
  font-size: 11px; font-family: 'DM Mono', monospace;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--accent); margin-top: 3px;
}
.card-hook { font-size: 13.5px; line-height: 1.5; color: var(--fg-muted); margin-top: 8px; }
.card-cta { font-size: 13px; font-weight: 500; color: var(--accent); margin-top: 10px; }
.card-lock { font-size: 13px; margin-top: 10px; color: var(--fg-muted); font-style: italic; }

.card-visited-badge {
  position: absolute; top: 12px; right: 16px;
  font-size: 11px; color: var(--fg-muted);
  display: flex; align-items: center; gap: 4px;
}
.card-visited-badge svg { width: 14px; height: 14px; color: var(--accent); }

/* ── Bottom bar ── */
.bottom-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  padding: 12px 16px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--bg); border-top: 1px solid var(--border);
  display: flex; justify-content: center; z-index: 50;
}
.bottom-bar-inner { max-width: 560px; width: 100%; display: flex; gap: 8px; }
.global-input {
  flex: 1; padding: 12px 16px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--fg);
  font-family: inherit; font-size: 14px; outline: none;
}
.global-input:focus { border-color: var(--accent-border); }
.global-input::placeholder { color: var(--fg-muted); }
.global-send {
  width: 44px; height: 44px;
  background: var(--accent); border: none; border-radius: var(--radius);
  color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.global-send:hover { opacity: 0.85; }
.global-send svg { width: 18px; height: 18px; }

/* ── Modal overlay ── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s ease;
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }

.modal-sheet {
  width: 100%; max-width: 600px;
  max-height: 85vh; min-height: 320px;
  background: var(--bg-modal);
  border: 1px solid var(--border);
  border-bottom: none;
  border-radius: 16px 16px 0 0;
  display: flex; flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}
.modal-overlay.open .modal-sheet { transform: translateY(0); }

/* Modal header */
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.modal-title-area { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.modal-kicker {
  font-size: 11px; font-family: 'DM Mono', monospace;
  text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent);
}
.modal-title { font-size: 16px; font-weight: 600; color: var(--fg); }
.modal-close {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--bg-card); border: 1px solid var(--border);
  color: var(--fg-muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; font-size: 18px; font-family: inherit;
  transition: border-color 0.2s, color 0.2s;
}
.modal-close:hover { border-color: var(--fg-muted); color: var(--fg); }

/* Modal body — the guided flow */
.modal-body {
  flex: 1; overflow-y: auto; padding: 20px;
  display: flex; flex-direction: column; gap: 16px;
}

/* Fenix mini-header inside modal */
.modal-fenix-bar {
  display: flex; align-items: center; gap: 8px;
}
.modal-fenix-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--accent-glow); border: 1px solid var(--accent-border);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0;
}
.modal-fenix-name { font-size: 13px; font-weight: 600; color: var(--fg-secondary); }

/* Fenix question bubble */
.modal-question {
  padding: 14px 18px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 14px; line-height: 1.6; color: var(--fg-secondary);
}

/* Input area inside modal */
.modal-input-area {
  display: flex; gap: 8px;
}
.modal-input {
  flex: 1; padding: 12px 14px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--fg);
  font-family: inherit; font-size: 14px; outline: none;
}
.modal-input:focus { border-color: var(--accent-border); }
.modal-input::placeholder { color: var(--fg-muted); }
.modal-submit {
  padding: 12px 20px;
  background: var(--accent); color: #fff; border: none;
  border-radius: var(--radius-sm);
  font-family: inherit; font-size: 14px; font-weight: 500;
  cursor: pointer; flex-shrink: 0;
}
.modal-submit:hover { opacity: 0.85; }

/* Thinking state */
.modal-thinking {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 18px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius);
}
.modal-thinking-dots { display: flex; gap: 4px; }
.modal-thinking-dots span {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); animation: pulse 1.2s ease infinite;
}
.modal-thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
.modal-thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
.modal-thinking-label { font-size: 13px; color: var(--fg-muted); font-style: italic; }

/* Structured output */
.modal-output {
  padding: 20px;
  background: var(--bg-card);
  border: 1px solid var(--accent-border);
  border-radius: var(--radius);
}
.modal-output h4 {
  font-size: 14px; font-weight: 600; color: var(--fg);
  margin: 0 0 6px;
}
.modal-output p {
  font-size: 14px; line-height: 1.6; color: var(--fg-secondary);
  margin: 0 0 12px;
}
.modal-output p:last-child { margin-bottom: 0; }
.modal-output strong { color: var(--fg); }
.modal-output .output-section { margin-bottom: 16px; }
.modal-output .output-section:last-child { margin-bottom: 0; }
.modal-output .output-label {
  font-size: 11px; font-family: 'DM Mono', monospace;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--accent); margin-bottom: 6px;
}

/* Follow-up actions inside modal */
.modal-actions {
  display: flex; flex-wrap: wrap; gap: 8px;
  padding-top: 4px;
}
.modal-action {
  padding: 8px 14px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 20px; font-size: 13px; color: var(--fg-secondary);
  cursor: pointer; font-family: inherit;
  transition: background 0.2s, border-color 0.2s;
}
.modal-action:hover { background: var(--bg-card-hover); border-color: var(--accent-border); color: var(--fg); }

/* Visitor echo in modal */
.modal-visitor-echo {
  display: flex; justify-content: flex-end;
}
.modal-visitor-bubble {
  padding: 10px 16px;
  background: var(--accent); color: #fff;
  border-radius: var(--radius);
  font-size: 14px; font-weight: 500;
  max-width: 80%;
}

/* ── Animations ── */
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
.fade-up { animation: fadeUp 0.35s ease forwards; }

/* ── Utility ── */
[hidden] { display: none !important; }

  var visited = {};
  var currentPersona = 'evaluator';

  function setAccent(hex) {
    var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    document.documentElement.style.setProperty('--accent', hex);
    document.documentElement.style.setProperty('--accent-glow', 'rgba('+r+','+g+','+b+',0.12)');
    document.documentElement.style.setProperty('--accent-border', 'rgba('+r+','+g+','+b+',0.25)');
    document.documentElement.style.setProperty('--accent-soft', 'rgba('+r+','+g+','+b+',0.08)');
  }

  function renderPersona(key) {
    var p = PERSONAS[key];
    if (!p) return;
    currentPersona = key;
    setAccent(p.accent);

    document.querySelectorAll('.persona-chip').forEach(function(c) {
      c.classList.toggle('active', c.dataset.persona === key);
    });

    document.getElementById('greeting').innerHTML = '<p>' + p.opening + '</p>';
    document.getElementById('cards-label').textContent = p.label;

    var list = document.getElementById('cards-list');
    list.innerHTML = '';

    p.cards.forEach(function(card) {
      var el = document.createElement('div');
      el.className = 'unlock-card';
      if (visited[key + ':' + card.id]) el.classList.add('visited');
      el.setAttribute('tabindex', '0');
      el.setAttribute('role', 'button');

      var iconSvg = ICONS[card.icon] || ICONS.target;
      var isVisited = visited[key + ':' + card.id];

      el.innerHTML =
        (isVisited ? '<div class="card-visited-badge">' + ICONS.check + ' Visited</div>' : '') +
        '<div class="card-top">' +
          '<div class="card-icon">' + iconSvg + '</div>' +
          '<div class="card-meta">' +
            '<div class="card-title">' + card.title + '</div>' +
            '<div class="card-tag">' + card.tag + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="card-hook">' + card.hook + '</div>' +
        (card.locked
          ? '<div class="card-lock">🔒 Connect to unlock this experience.</div>'
          : '<div class="card-cta">' + card.cta + '</div>');

      el.addEventListener('click', function() {
        if (card.locked) return;
        openModal(card);
      });
      el.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (!card.locked) openModal(card); }
      });

      list.appendChild(el);
    });
  }

  // ── Modal ──
  var modal = document.getElementById('modal');
  var modalBody = document.getElementById('modal-body');

  function openModal(card) {
    var m = card.modal;
    document.getElementById('modal-kicker').textContent = m.kicker;
    document.getElementById('modal-title').textContent = m.title;
    modalBody.innerHTML = '';

    // Fenix identity
    var bar = document.createElement('div');
    bar.className = 'modal-fenix-bar';
    bar.innerHTML = '<div class="modal-fenix-avatar">🔥</div><div class="modal-fenix-name">Fenix</div>';
    modalBody.appendChild(bar);

    // Question
    var q = document.createElement('div');
    q.className = 'modal-question fade-up';
    q.textContent = m.question;
    modalBody.appendChild(q);

    if (m.type === 'static') {
      showStaticOutput(m.output);
    } else if (m.type === 'choice') {
      showChoices(m.choices, m.output, card);
    } else if (m.type === 'input') {
      showInput(m.placeholder, m.thinkingLabel, m.output, card);
    }

    modal.classList.add('open');
    document.body.style.overflow = 'hidden';

    visited[currentPersona + ':' + card.id] = true;
  }

  function closeModal() {
    modal.classList.remove('open');
    document.body.style.overflow = '';
    renderPersona(currentPersona);
  }

  function showStaticOutput(html) {
    var out = document.createElement('div');
    out.className = 'modal-output fade-up';
    out.innerHTML = html;
    modalBody.appendChild(out);
    addFollowUpActions();
  }

  function showChoices(choices, outputData, card) {
    var wrap = document.createElement('div');
    wrap.className = 'modal-actions fade-up';
    choices.forEach(function(choice) {
      var btn = document.createElement('button');
      btn.className = 'modal-action';
      btn.textContent = choice;
      btn.addEventListener('click', function() {
        // Echo choice
        var echo = document.createElement('div');
        echo.className = 'modal-visitor-echo fade-up';
        echo.innerHTML = '<div class="modal-visitor-bubble">' + choice + '</div>';
        wrap.replaceWith(echo);

        showThinking('Working on it...', function() {
          var out = document.createElement('div');
          out.className = 'modal-output fade-up';
          out.innerHTML = typeof outputData === 'object' ? outputData.content : outputData;
          modalBody.appendChild(out);
          addFollowUpActions();
        });
      });
      wrap.appendChild(btn);
    });
    modalBody.appendChild(wrap);
  }

  function showInput(placeholder, thinkingLabel, outputHtml, card) {
    var row = document.createElement('div');
    row.className = 'modal-input-area fade-up';
    var input = document.createElement('input');
    input.className = 'modal-input';
    input.placeholder = placeholder;
    var btn = document.createElement('button');
    btn.className = 'modal-submit';
    btn.textContent = 'Go';
    row.appendChild(input);
    row.appendChild(btn);
    modalBody.appendChild(row);

    setTimeout(function() { input.focus(); }, 400);

    function submit() {
      var val = input.value.trim();
      if (!val) return;

      // Echo
      var echo = document.createElement('div');
      echo.className = 'modal-visitor-echo fade-up';
      echo.innerHTML = '<div class="modal-visitor-bubble">' + val + '</div>';
      row.replaceWith(echo);

      showThinking(thinkingLabel || 'Working on it...', function() {
        var out = document.createElement('div');
        out.className = 'modal-output fade-up';
        out.innerHTML = outputHtml;
        modalBody.appendChild(out);
        addFollowUpActions();
      });
    }

    btn.addEventListener('click', submit);
    input.addEventListener('keydown', function(e) { if (e.key === 'Enter') submit(); });
  }

  function showThinking(label, cb) {
    var think = document.createElement('div');
    think.className = 'modal-thinking fade-up';
    think.innerHTML = '<div class="modal-thinking-dots"><span></span><span></span><span></span></div><div class="modal-thinking-label">' + label + '</div>';
    modalBody.appendChild(think);
    modalBody.scrollTop = modalBody.scrollHeight;

    setTimeout(function() {
      think.remove();
      cb();
      modalBody.scrollTop = modalBody.scrollHeight;
    }, 1500);
  }

  function addFollowUpActions() {
    var wrap = document.createElement('div');
    wrap.className = 'modal-actions fade-up';
    wrap.innerHTML =
      '<button class="modal-action">Ask a follow-up</button>' +
      '<button class="modal-action" id="action-done">Done — back to cards</button>';
    modalBody.appendChild(wrap);
    modalBody.scrollTop = modalBody.scrollHeight;

    document.getElementById('action-done').addEventListener('click', closeModal);
  }

  // Close button
  document.getElementById('modal-close').addEventListener('click', closeModal);
  modal.addEventListener('click', function(e) {
    if (e.target === modal) closeModal();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && modal.classList.contains('open')) closeModal();
  });

  // Persona chips
  document.querySelectorAll('.persona-chip:not(.planned)').forEach(function(chip) {
    chip.addEventListener('click', function() {
      var key = chip.dataset.persona;
      if (PERSONAS[key]) renderPersona(key);
    });
  });

  // Init
  renderPersona('evaluator');
})();
</script>
